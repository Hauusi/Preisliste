<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ sheet.title }}</title>
  <link rel="stylesheet" href="/static/datasheet.css">
</head>
<body class="ds-print">
<div class="ds-toolbar">
  <a href="/datenblatt/{{ sheet.id }}">← Bearbeiten</a>
  <a href="/datenblatt">Alle Datenblätter</a>
  <span class="grow"></span>
  <span class="ds-pages">{{ pages | length }} {{ "Seite" if pages | length == 1 else "Seiten" }}</span>
  <button type="button" data-print>Drucken / als PDF speichern</button>
</div>
<p class="ds-toolbar-hint">Im Druckdialog „Als PDF speichern“ wählen, Format A4, Ränder „Keine“, „Hintergrundgrafiken“ einschalten.</p>
<div class="ds-warnings" data-warnings hidden></div>
<div class="ds-doc">
{% include "_datasheet_pages.html" %}
</div>
<script src="/static/datasheet.js"></script>
</body>
</html>
