{# Schrittleiste für den Ablauf Liste einspielen -> kalkulieren. Erwartet: step (1-6) #}
{% set labels = ["Datei", "Spalten", "Hersteller & Währung", "Import", "Kalkulation", "Ergebnis"] %}
<ol class="steps-bar">
  {% for l in labels %}
    <li class="{% if loop.index < step %}done{% elif loop.index == step %}current{% endif %}"><span>{{ loop.index }}</span>{{ l }}</li>
  {% endfor %}
</ol>
