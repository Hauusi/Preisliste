{# Schrittleiste: Liste einspielen -> prüfen -> verarbeiten -> Ergebnis. Erwartet: step (1-4) #}
{% set labels = ["Datei", "Prüfen", "Verarbeiten", "Ergebnis"] %}
<ol class="steps-bar">
  {% for l in labels %}
    <li class="{% if loop.index < step %}done{% elif loop.index == step %}current{% endif %}"><span>{{ loop.index }}</span>{{ l }}</li>
  {% endfor %}
</ol>
