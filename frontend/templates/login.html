{% extends "base.html" %}
{% block title %}Anmelden{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Anmelden</h1>
  {% if error %}<p class="msg FEHLER">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <label>Benutzername <input name="username" autocomplete="username" required maxlength="64" autofocus></label>
    <label>Passwort <input name="password" type="password" autocomplete="current-password" required maxlength="256"></label>
    <button type="submit">Anmelden</button>
  </form>
</section>
{% endblock %}
