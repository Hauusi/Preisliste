{% extends "base.html" %}
{% block title %}Anmelden{% endblock %}
{% block content %}
<section class="card login-card">
  <div class="brand"><span class="brand-mark">€</span><span>Preisliste</span></div>
  <h1>Willkommen zurück</h1>
  <p class="hint">Melde dich an, um Preislisten abzugleichen und zu kalkulieren.</p>
  {% if error %}<p class="msg FEHLER">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <label>Benutzername <input name="username" autocomplete="username" required maxlength="64" autofocus></label>
    <label>Passwort <input name="password" type="password" autocomplete="current-password" required maxlength="256"></label>
    <button type="submit" class="button big full">Anmelden</button>
  </form>
</section>
{% endblock %}
