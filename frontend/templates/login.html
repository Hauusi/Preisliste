{% extends "base.html" %}
{% block title %}Anmelden{% endblock %}
{% block content %}
<section class="card login-card">
  <div class="brand"><img class="brand-logo" src="/static/bb-mark.png" alt="Braun &amp; Braun" width="46" height="32"><img class="brand-logo dark-only" src="/static/bb-mark-light.png" alt="" width="46" height="32"><span class="brand-name">Sales Assistant</span></div>
  <h1>Anmelden</h1>
  {% if error %}<p class="msg FEHLER">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <label>Benutzername <input name="username" autocomplete="username" required maxlength="64" autofocus></label>
    <label>Passwort <input name="password" type="password" autocomplete="current-password" required maxlength="256"></label>
    <button type="submit" class="button big full">Anmelden</button>
  </form>
</section>
{% endblock %}
